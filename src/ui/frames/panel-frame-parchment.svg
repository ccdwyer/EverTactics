<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Parchment-tone sibling of panel-frame.svg: same 9-slice geometry (slice 34)
    so the two frames are interchangeable, but the metal is darkened bronze so it
    holds against a vellum fill instead of a midnight one.
  -->
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a98a3c"/>
      <stop offset="0.42" stop-color="#7d6320"/>
      <stop offset="0.8" stop-color="#54411a"/>
      <stop offset="1" stop-color="#3a2c11"/>
    </linearGradient>
    <g id="corner">
      <path d="M6 6 H30 V11.5 H17.5 V30 H6 Z" fill="url(#bronze)"/>
      <path d="M30 6 L30 11.5 L33.5 8.75 Z" fill="url(#bronze)"/>
      <path d="M6 30 L11.5 30 L8.75 33.5 Z" fill="url(#bronze)"/>
      <path d="M11.8 7.4 L16.2 11.8 L11.8 16.2 L7.4 11.8 Z" fill="#3a2c11"/>
      <path d="M11.8 8.9 L14.7 11.8 L11.8 14.7 L8.9 11.8 Z" fill="#d8c48a"/>
      <path d="M21 21 L27 21 L27 22.6 L22.6 22.6 L22.6 27 L21 27 Z" fill="#7d6320" opacity="0.85"/>
    </g>
  </defs>

  <rect x="2" y="2" width="124" height="124" fill="none" stroke="#2c2212" stroke-width="4"/>
  <rect x="6" y="6" width="116" height="116" fill="none" stroke="url(#bronze)" stroke-width="3"/>
  <rect x="7.4" y="7.4" width="113.2" height="113.2" fill="none" stroke="#e5d3a2" stroke-width="0.9" opacity="0.4"/>
  <rect x="15" y="15" width="98" height="98" fill="none" stroke="#3a2c11" stroke-width="6" opacity="0.45"/>
  <rect x="19.4" y="19.4" width="89.2" height="89.2" fill="none" stroke="#7d6320" stroke-width="1.3"/>

  <use href="#corner"/>
  <use href="#corner" transform="translate(128,0) scale(-1,1)"/>
  <use href="#corner" transform="translate(0,128) scale(1,-1)"/>
  <use href="#corner" transform="translate(128,128) scale(-1,-1)"/>
</svg>
