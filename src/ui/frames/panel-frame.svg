<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    9-slice panel frame. Sliced at 34 (see styles.css), so everything inside the
    four 34x34 corner squares is drawn 1:1 and the strips between them stretch.
    Ornament therefore lives only in the corners; the edges carry rules that are
    constant along their length so stretching them is invisible.
  -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e9bb"/>
      <stop offset="0.42" stop-color="#c9a227"/>
      <stop offset="0.78" stop-color="#8a6f2a"/>
      <stop offset="1" stop-color="#5d4a1c"/>
    </linearGradient>

    <!-- One corner's worth of filigree, drawn in the top-left 34x34 square. -->
    <g id="corner">
      <!-- bracket plate hugging the corner -->
      <path d="M6 6 H30 V11.5 H17.5 V30 H6 Z" fill="url(#gold)"/>
      <!-- barbed terminals that run toward the stretched edges -->
      <path d="M30 6 L30 11.5 L33.5 8.75 Z" fill="url(#gold)"/>
      <path d="M6 30 L11.5 30 L8.75 33.5 Z" fill="url(#gold)"/>
      <!-- lozenge stud in the elbow -->
      <path d="M11.8 7.4 L16.2 11.8 L11.8 16.2 L7.4 11.8 Z" fill="#0a0d16"/>
      <path d="M11.8 8.9 L14.7 11.8 L11.8 14.7 L8.9 11.8 Z" fill="#f7e9bb"/>
      <!-- inner scroll tick, reads as filigree at panel scale -->
      <path d="M21 21 L27 21 L27 22.6 L22.6 22.6 L22.6 27 L21 27 Z" fill="#c9a227" opacity="0.85"/>
    </g>
  </defs>

  <!-- outer keyline: separates the frame from whatever is behind the panel -->
  <rect x="2" y="2" width="124" height="124" fill="none" stroke="#06090f" stroke-width="4"/>
  <!-- main gold rule -->
  <rect x="6" y="6" width="116" height="116" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <!-- specular hairline riding on top of the rule -->
  <rect x="7.4" y="7.4" width="113.2" height="113.2" fill="none" stroke="#f7e9bb" stroke-width="0.9" opacity="0.55"/>
  <!-- recessed channel between the outer rule and the inner hairline -->
  <rect x="15" y="15" width="98" height="98" fill="none" stroke="#05070d" stroke-width="6" opacity="0.72"/>
  <!-- inner hairline -->
  <rect x="19.4" y="19.4" width="89.2" height="89.2" fill="none" stroke="#9a7c2e" stroke-width="1.3"/>
  <rect x="21.2" y="21.2" width="85.6" height="85.6" fill="none" stroke="#f7e9bb" stroke-width="0.6" opacity="0.22"/>

  <use href="#corner"/>
  <use href="#corner" transform="translate(128,0) scale(-1,1)"/>
  <use href="#corner" transform="translate(0,128) scale(1,-1)"/>
  <use href="#corner" transform="translate(128,128) scale(-1,-1)"/>
</svg>
