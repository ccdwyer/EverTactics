<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>sprite harness</title>
    <style>
      html,body{margin:0;height:100%;background:#0a0d14;overflow:hidden}
      canvas{display:block}
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { IsoCamera, TILE_SIZE, HEIGHT_UNIT, gridToWorld } from '/src/render/camera.ts';
      import { SpriteLayer, UnitSprite } from '/src/render/sprites.ts';

      const params = new URLSearchParams(location.search);
      const yawIndex = Number(params.get('yaw') ?? 0);
      const mode = params.get('mode') ?? 'grid';
      const zoom = Number(params.get('zoom') ?? 4);

      const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
      renderer.setPixelRatio(1);
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x121826);

      const keyDir = new THREE.Vector3(-0.55, -1.0, -0.45).normalize();
      const key = new THREE.DirectionalLight(0xfff0d8, 2.6);
      key.position.copy(keyDir).multiplyScalar(-24).add(new THREE.Vector3(6, 0, 6));
      key.target.position.set(6, 0, 6);
      scene.add(key.target);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.left = -14; key.shadow.camera.right = 14;
      key.shadow.camera.top = 14; key.shadow.camera.bottom = -14;
      key.shadow.camera.near = 1; key.shadow.camera.far = 60;
      key.shadow.bias = -0.0006;
      key.shadow.normalBias = 0.02;
      scene.add(key);
      scene.add(new THREE.HemisphereLight(0x9fc4ff, 0x2a2418, 0.85));

      // Terrain stand-in: a tile field with a couple of raised blocks and a cliff
      // that must occlude a unit standing behind it.
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x6f7a52, roughness: 0.95 });
      const stoneMat = new THREE.MeshStandardMaterial({ color: 0x8b8577, roughness: 0.9 });
      function block(gx, gy, h, mat) {
        const geo = new THREE.BoxGeometry(TILE_SIZE, h * HEIGHT_UNIT + 2, TILE_SIZE);
        const m = new THREE.Mesh(geo, mat);
        m.position.set((gx + 0.5) * TILE_SIZE, h * HEIGHT_UNIT - (h * HEIGHT_UNIT + 2) / 2, (gy + 0.5) * TILE_SIZE);
        m.castShadow = true; m.receiveShadow = true;
        scene.add(m);
        return m;
      }
      const heights = {};
      for (let y = 0; y < 12; y++) for (let x = 0; x < 12; x++) {
        let h = 0;
        if (x >= 7 && y >= 6) h = 4;              // plateau
        if (x === 6 && y >= 6) h = 2;             // step
        if (x === 3 && y === 3) h = 2;
        if (x === 9 && y === 2) h = 8;            // tall cliff, occlusion test
        if (x === 8 && y === 2) h = 8;
        heights[`${x},${y}`] = h;
        block(x, y, h, h > 0 ? stoneMat : groundMat);
      }

      const camera = new IsoCamera({ pixelScale: zoom, yawIndex: yawIndex % 4, pixelSnap: true });
      camera.setViewport(renderer.domElement.width, renderer.domElement.height, 1);

      const layer = new SpriteLayer();
      scene.add(layer.group);
      layer.setKeyLight(keyDir, 0xffe0b0);

      const view = {
        get camera() { return camera.camera; },
        get worldPerDevicePixel() { return camera.worldPerDevicePixel; },
        get yawRadians() { return camera.yawRadians; },
      };

      const made = [];
      async function place(sheetKey, gx, gy, gz, facing, team, tweak) {
        const sheet = await layer.sheet(sheetKey);
        const sprite = new UnitSprite(`${sheetKey}-${gx}-${gy}`, sheet);
        sprite.setCell(gx, gy, gz);
        sprite.facing = facing;
        sprite.setTeam(team);
        layer.group.add(sprite.object);
        layer.sprites?.set?.(sprite.unitId, sprite);
        sprite.setKeyLight(keyDir, 0xffe0b0);
        made.push(sprite);
        tweak?.(sprite);
        return sprite;
      }

      const FACINGS = ['N', 'E', 'S', 'W'];

      async function build() {
        if (mode === 'facing') {
          // one row of knights, one per grid facing, to check the view resolution
          for (let i = 0; i < 4; i++) {
            await place('knight_male', 2 + i * 2, 2, 0, FACINGS[i], 'player');
          }
          for (let i = 0; i < 4; i++) {
            await place('knight_male', 2 + i * 2, 5, 0, FACINGS[i], 'enemy');
          }
        } else if (mode === 'palette') {
          const teams = ['player', 'enemy', 'ally', 'neutral'];
          for (let i = 0; i < 4; i++) await place('knight_male', 1 + i * 2, 2, 0, 'S', teams[i]);
          for (let i = 0; i < 4; i++) await place('black_mage_male', 1 + i * 2, 5, 0, 'S', teams[i]);
          for (let i = 0; i < 4; i++) await place('monk_female', 1 + i * 2, 8, 0, 'S', teams[i]);
        } else if (mode === 'states') {
          const a = await place('knight_male', 2, 2, 0, 'S', 'player');
          a.setSelection('active'); a.setTurnMarker(true);
          a.setStatuses([{ status: 'haste', remaining: 40 }, { status: 'protect', remaining: 20 }, { status: 'poison', remaining: 10 }]);
          a.popLabel('142', 'damage');
          const b = await place('archer_female', 5, 2, 0, 'S', 'enemy');
          b.setSelection('hostile');
          b.popLabel('999', 'crit');
          const c = await place('white_mage_male', 8, 2, 0, 'S', 'ally');
          c.setSelection('target');
          c.popLabel('MISS', 'miss');
          c.setStatuses([{ status: 'regen', remaining: 30 }]);
          const d = await place('thief_male', 2, 5, 0, 'S', 'enemy');
          d.setKnockedOut(true);
          const e = await place('monk_male', 5, 5, 0, 'S', 'player');
          e.play('attack', { restart: true, loop: true });
          const f = await place('summoner_female', 8, 5, 0, 'S', 'player');
          f.crystallise(3.0);
        } else if (mode === 'closeup') {
          await place('knight_male', 1, 5, 0, 'S', 'player');
          await place('knight_male', 3, 5, 0, 'E', 'player');
          await place('knight_male', 1, 7, 0, 'N', 'player');
          await place('knight_male', 3, 7, 0, 'W', 'player');
          window.__FOCUS__ = new THREE.Vector3(2.5, 1, 6.5);
        } else if (mode === 'walk') {
          const a = await place('knight_male', 2, 6, 0, 'S', 'player');
          const path = [];
          for (let i = 0; i < 5; i++) path.push({ x: 2 + i, y: 6, z: 0 });
          path.push({ x: 6, y: 6, z: 2 });
          const loop = async () => { await a.walkPath(path, { tilesPerSecond: 2.6 }); a.setCell(2,6,0); loop(); };
          loop();
        } else if (mode === 'occlusion') {
          // behind the cliff (further from the camera at yaw 0 => larger x+y)
          await place('knight_male', 9, 4, 0, 'N', 'player');
          await place('knight_male', 9, 0, 0, 'S', 'enemy');
          await place('knight_male', 7, 6, 4, 'S', 'player');
          await place('knight_male', 6, 6, 2, 'W', 'ally');
        } else {
          const keys = ['knight_male', 'archer_male', 'monk_female', 'white_mage_female',
                        'black_mage_male', 'time_mage_female', 'thief_male', 'ninja_female',
                        'samurai_male', 'dragoon_male', 'geomancer_female', 'summoner_male'];
          for (let i = 0; i < keys.length; i++) {
            const gx = 1 + (i % 4) * 3;
            const gy = 1 + Math.floor(i / 4) * 3;
            await place(keys[i], gx, gy, heights[`${gx},${gy}`] ?? 0, 'S', i % 3 === 1 ? 'enemy' : i % 3 === 2 ? 'ally' : 'player');
          }
        }
      }

      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        camera.update(dt);
        for (const s of made) s.update(dt, view);
        renderer.render(scene, camera.camera);
        requestAnimationFrame(frame);
      }

      build().then(async () => {
        camera.focus(window.__FOCUS__ ?? new THREE.Vector3(6, 1, 6), { immediate: true });
        camera.update(0);
        for (const s of made) s.update(0.016, view);
        renderer.render(scene, camera.camera);
        requestAnimationFrame(frame);
        window.__CAM__ = camera; window.__SPRITES__ = made;
        // let animations settle a beat
        await new Promise((r) => setTimeout(r, Number(params.get('settle') ?? 400)));
        window.__READY__ = true;
      }).catch((e) => { window.__ERR__ = String(e && e.stack || e); console.error(e); });
    </script>
  </body>
</html>
